plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow'
}

description = 'Ballerina - WhatsApp Business Native'

dependencies {
    implementation group: 'org.ballerinalang', name: 'ballerina-lang', version: "${ballerinaLangVersion}"
    implementation(group: 'org.ballerinalang', name: 'ballerina-runtime', version: "${ballerinaLangVersion}") {
        transitive = false
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.wso2.org/nexus/content/groups/wso2-public/' }
}

shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.runtimeClasspath]
    dependencies {
        // The Ballerina runtime is provided by the distribution at runtime; do not bundle it.
        exclude(dependency('org.ballerinalang:.*:.*'))
    }
}

build.dependsOn(shadowJar)
